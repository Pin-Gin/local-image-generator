<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEMORIELA Local Image Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>MEMORIELA</h1>
      <p>Local Image Generator</p>
    </header>

    <section class="panel">
      <label for="profile">Profile</label>
      <select id="profile"></select>

      <div class="seed-controls">
        <label for="seed-mode">Seed</label>
        <select id="seed-mode">
          <option value="RANDOM" selected>Random</option>
          <option value="FIXED">Fixed</option>
        </select>
        <input id="seed-value" type="number" min="0" max="9223372036854775807" step="1" value="1" disabled>
      </div>
    </section>

    <section id="messages" class="messages">
      <div class="message system">生成したい内容を入力してください。JSON確認と画像生成を同じ入力から実行できます。</div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="4" placeholder="例：ゆらを白背景で正面立ち、服装と髪型はマスターと同じ、落ち着いた表情、2Dアニメ調で"></textarea>
      <div class="actions">
        <button id="json-button" type="submit">JSONを作成</button>
        <button id="generate-button" type="button">画像を生成</button>
      </div>
    </form>

    <section class="panel">
      <h2>Generation Request JSON</h2>
      <pre id="json-preview">未作成</pre>
    </section>

    <section class="panel">
      <h2>Generated Image</h2>
      <div id="generation-status">未生成</div>
      <img id="generated-image" class="generated-image" alt="Generated result" hidden>
      <pre id="generation-meta"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
