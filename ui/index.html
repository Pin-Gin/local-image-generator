<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEMORIELA Local Image Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>MEMORIELA</h1>
      <p>Local Image Generator</p>
    </header>

    <section id="messages" class="messages">
      <div class="message system">生成したい内容を入力して、そのまま生成できます。内部JSONは自動で作成されます。</div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="5" placeholder="例：ゆらを白背景で正面立ち、服装と髪型はマスターと同じ、落ち着いた表情、2Dアニメ調で"></textarea>
      <button id="generate-button" class="primary-action" type="submit">画像を生成</button>
    </form>

    <section class="panel result-panel">
      <div class="section-heading">
        <h2>Generated Image</h2>
        <div id="generation-status">未生成</div>
      </div>
      <img id="generated-image" class="generated-image" alt="Generated result" hidden>
      <pre id="generation-meta"></pre>
    </section>

    <details class="panel advanced-panel">
      <summary>詳細設定</summary>
      <div class="advanced-content">
        <label for="profile">Profile</label>
        <select id="profile"></select>

        <div class="seed-controls">
          <label for="seed-mode">Seed</label>
          <select id="seed-mode">
            <option value="RANDOM" selected>Random</option>
            <option value="FIXED">Fixed</option>
          </select>
          <input id="seed-value" type="number" min="0" max="9007199254740991" step="1" value="1" disabled>
        </div>
      </div>
    </details>

    <details class="panel advanced-panel">
      <summary>Generation Request JSON</summary>
      <pre id="json-preview">未作成</pre>
    </details>
  </main>
  <script src="app.js"></script>
</body>
</html>
