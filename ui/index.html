<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Image Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="tool-rail" aria-label="ツール">
      <button class="tool-button active" type="button" data-panel="settings-panel" title="詳細設定" aria-label="詳細設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94L14.38 2.8a.5.5 0 0 0-.49-.4h-3.84a.5.5 0 0 0-.49.4L9.2 5.32a7.2 7.2 0 0 0-1.63.94L5.18 5.3a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.52a.5.5 0 0 0 .49.4h3.84a.5.5 0 0 0 .49-.4l.36-2.52c.58-.24 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.25A3.25 3.25 0 1 1 12 8.75a3.25 3.25 0 0 1 0 6.5Z"/></svg>
      </button>
      <button class="tool-button" type="button" data-panel="json-panel" title="Generation Request JSON" aria-label="Generation Request JSON">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5.6 4.2 10l4.4 4.4-1.4 1.4L1.4 10l5.8-5.8 1.4 1.4Zm6.8 0 1.4-1.4L22.6 10l-5.8 5.8-1.4-1.4 4.4-4.4-4.4-4.4ZM13.9 3l-3.6 14h-2l3.6-14h2Z"/></svg>
      </button>
    </aside>

    <aside class="side-panel" id="settings-panel">
      <div class="side-panel-header"><h2>詳細設定</h2></div>
      <div class="side-panel-body">
        <label for="profile">Profile</label>
        <select id="profile"></select>

        <label for="seed-mode">Seed</label>
        <select id="seed-mode">
          <option value="RANDOM" selected>Random</option>
          <option value="FIXED">Fixed</option>
        </select>
        <input id="seed-value" type="number" min="0" max="9007199254740991" step="1" value="1" disabled>
      </div>
    </aside>

    <aside class="side-panel hidden" id="json-panel">
      <div class="side-panel-header"><h2>Generation Request JSON</h2></div>
      <div class="side-panel-body json-body"><pre id="json-preview">未作成</pre></div>
    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div>
          <h1>Local Image Generator</h1>
          <p>自然言語またはJSONを入力して画像を生成します。</p>
        </div>
      </header>

      <section class="result-panel" aria-label="生成画像">
        <div class="result-header">
          <span class="section-label">生成画像</span>
          <div id="generation-status" class="status-line">未生成</div>
        </div>
        <div class="image-stage" id="image-stage">
          <div id="image-placeholder" class="image-placeholder">生成された画像をここに表示します</div>
          <img id="generated-image" class="generated-image" alt="Generated result" hidden>
        </div>
        <pre id="generation-meta" class="generation-meta"></pre>
      </section>

      <form id="chat-form" class="composer-panel">
        <textarea id="prompt" rows="4" placeholder="生成内容を入力してください。Enterで生成 / Shift+Enterで改行"></textarea>
        <button id="generate-button" class="primary-action" type="submit">画像を生成</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
